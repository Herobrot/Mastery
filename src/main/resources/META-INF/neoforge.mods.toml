modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Herobrot"
credits="Globox"
description='''
Adds professions which when leveling up, rewards with XP and bonus to the player.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
modId="cloth_config"
type="required"
versionRange="[15.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="heroslib"
type="required"
versionRange="[1.1.2,)"
ordering="AFTER"
side="BOTH"

